spring:
  application:
    name: fairshare-backend
  config:
    # Nạp mật khẩu từ file riêng (đã .gitignore). "optional:" để môi trường khác
    # (Docker/server) có thể cấp mật khẩu qua biến môi trường SPRING_DATASOURCE_PASSWORD.
    import: optional:classpath:application-secret.yaml
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fairshare}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8mb4
    username: ${DB_USER:root}
    # password: lấy từ application-secret.yaml
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:fairshare-dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256} # ggignore
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
