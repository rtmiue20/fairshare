spring:
  application:
    name: fairshare-backend
  config:
    # Nạp mật khẩu từ file riêng (đã .gitignore). "optional:" để môi trường khác
    # (Docker/server) có thể cấp mật khẩu qua biến môi trường SPRING_DATASOURCE_PASSWORD.
    import: optional:classpath:application-secret.yaml
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fairshare}
    username: ${DB_USER:root}
    # password: lấy từ application-secret.yaml
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
