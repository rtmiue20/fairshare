spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USER}
    # password: KHÔNG ghi ở đây. Trên server/Docker hãy đặt biến môi trường
    # SPRING_DATASOURCE_PASSWORD (hoặc dùng application-secret.yaml không commit).
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080