spring:
  config:
    activate:
      on-profile: prod
  main:
    lazy-initialization: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8mb4&connectTimeout=30000&socketTimeout=60000&sslMode=${DB_SSL_MODE:disable}
    username: ${DB_USER}
    # password: KHÔNG ghi ở đây. Trên server/Docker hãy đặt biến môi trường
    # SPRING_DATASOURCE_PASSWORD (hoặc dùng application-secret.yaml không commit).
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 45000
      initialization-fail-timeout: 60000
      data-source-properties:
        useServerPrepStmts: false
        cachePrepStmts: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  address: ${IP:0.0.0.0}
  tomcat:
    threads:
      max: 20
      min-spare: 2

management:
  health:
    mail:
      enabled: false

app:
  supabase:
    url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:fairshare-uploads}
