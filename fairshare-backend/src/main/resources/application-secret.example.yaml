# MẪU file mật khẩu cho backend (chạy bằng IntelliJ / mvnw, không dùng Docker).
#
# Cách dùng:
#   1. Copy file này thành application-secret.yaml (cùng thư mục)
#   2. Điền mật khẩu MariaDB trên máy bạn vào dòng password
#
# application.yaml đã có sẵn dòng import file này:
#   spring.config.import: optional:classpath:application-secret.yaml
#
# application-secret.yaml đã nằm trong .gitignore: KHÔNG commit file đó lên Git.
# Khi chạy bằng Docker Compose thì không cần file này: mật khẩu lấy từ file .env.

spring:
  datasource:
    password:
