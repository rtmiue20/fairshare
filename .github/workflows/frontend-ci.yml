name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, test & build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      # Xuất thêm JUnit XML để lưu làm minh chứng test report (M5 – Sprint 3)
      - name: Unit test (Vitest)
        run: npm run test:ci

      - name: Type-check & build (tsc + Vite)
        run: npm run build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend/test-results/
          retention-days: 14

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          p = "test-results/junit.xml"
          print("### Frontend tests")
          if not os.path.exists(p):
              print("Không có file kết quả (test chưa chạy tới bước này).")
          else:
              r = ET.parse(p).getroot()
              t, f, e, s = (int(r.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              print(f"| Tổng | Pass | Fail | Error | Skip |\n|---|---|---|---|---|\n| {t} | {t-f-e-s} | {f} | {e} | {s} |")
          PY
