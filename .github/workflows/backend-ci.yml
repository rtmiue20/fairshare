name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "fairshare-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "fairshare-backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (Java 21, MariaDB Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fairshare-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: fairshare-backend/pom.xml

      # verify = compile + unit test + integration test (FairShareApplicationTests
      # dựng MariaDB 10.11 bằng Testcontainers, chạy toàn bộ Flyway migration).
      - name: Build and run tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: fairshare-backend/target/surefire-reports/
          retention-days: 14

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("target/surefire-reports/TEST-*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print("### Backend tests")
          print(f"| Tổng | Pass | Fail | Error | Skip |\n|---|---|---|---|---|\n| {t} | {t-f-e-s} | {f} | {e} | {s} |")
          PY
