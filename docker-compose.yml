# FairShare – môi trường dev/demo (WP5 – QA & Deployment, M5)
# Chạy toàn bộ:        docker compose up -d --build
# Chỉ chạy MariaDB:    docker compose up -d db      (dùng khi code backend bằng IDE)
# Biến môi trường lấy từ file .env (copy từ .env.example). Mật khẩu KHÔNG có giá trị mặc định:
# thiếu DB_PASSWORD / DB_ROOT_PASSWORD trong .env thì compose báo lỗi ngay.

services:
  db:
    image: mariadb:10.11
    container_name: fairshare-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
      MARIADB_DATABASE: ${DB_NAME:-fairshare}
      MARIADB_USER: ${DB_USER:-fairshare}
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Script có sẵn trong image MariaDB: chỉ "healthy" khi InnoDB đã sẵn sàng nhận kết nối
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - fairshare-network

  backend:
    build:
      context: ./fairshare-backend
      dockerfile: Dockerfile
    container_name: fairshare-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fairshare}
      DB_USER: ${DB_USER:-fairshare}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?}
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy   # Chờ DB sẵn sàng, tránh Flyway lỗi kết nối lúc khởi động
    networks:
      - fairshare-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fairshare-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - fairshare-network

networks:
  fairshare-network:
    driver: bridge

volumes:
  db_data:
