<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .fs-gray { stroke: #64748b; }
    .fs-blue { stroke: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .fs-gray { stroke: #a1a1aa; }
      .fs-blue { stroke: #38bdf8; }
    }
  </style>

  <!-- Top-Right Quadrant (Cool Gray) -->
  <rect class="fs-gray" x="10.5" y="3.5" width="18" height="18" rx="3.5" fill="none" stroke-width="2.6" />

  <!-- Bottom-Left Quadrant (Electric Blue) -->
  <rect class="fs-blue" x="3.5" y="10.5" width="18" height="18" rx="3.5" fill="none" stroke-width="2.6" />
</svg>
